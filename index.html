<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA / Theme -->
    <meta name="theme-color" content="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="AuthorForge" />
    <link rel="apple-touch-icon" href="https://base44.com/logo_v2.svg" />
    <meta name="application-name" content="AuthorForge" />
    <meta name="msapplication-TileColor" content="#f59e0b" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Primary Meta -->
    <title>AuthorForge – AI-Powered Book Creation Suite</title>
    <meta name="description" content="AuthorForge helps authors write, publish, and market their books using AI agents. From character creation to cover design, video trailers, and book websites — all in one platform." />
    <meta name="keywords" content="AI book writing, book creation software, AI author tool, self-publishing platform, book marketing AI, character creation AI, book cover design AI" />
    <meta name="author" content="AuthorForge" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://authorforge.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://authorforge.com/" />
    <meta property="og:title" content="AuthorForge – AI-Powered Book Creation Suite" />
    <meta property="og:description" content="Write, publish, and market your book with AI agents that handle everything from character creation to cover design, video trailers, and book websites." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=1200&h=630&fit=crop&q=80" />
    <meta property="og:site_name" content="AuthorForge" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://authorforge.com/" />
    <meta name="twitter:title" content="AuthorForge – AI-Powered Book Creation Suite" />
    <meta name="twitter:description" content="Write, publish, and market your book with AI agents that handle everything from character creation to cover design, video trailers, and book websites." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=1200&h=630&fit=crop&q=80" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AuthorForge",
      "url": "https://authorforge.com",
      "logo": "https://authorforge.com/logo.svg",
      "description": "AuthorForge is an AI-powered book creation suite that helps authors write, publish, and market their books using intelligent AI agents.",
      "sameAs": []
    }
    </script>

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "AuthorForge",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Start with a free 7-day trial. No credit card required."
      },
      "description": "AI-powered book creation suite for authors. Features include AI character creation, smart outlining, cover design, video commercials, book websites, and team collaboration.",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "ratingCount": "50000"
      }
    }
    </script>

    <!-- Structured Data: FAQPage (AEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is AuthorForge?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AuthorForge is an AI-powered book creation suite that helps authors write, publish, and market their books. It includes AI agents for character creation, smart outlining, cover design, video trailer generation, book landing pages, and team collaboration."
          }
        },
        {
          "@type": "Question",
          "name": "How does AuthorForge use AI to help write a book?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AuthorForge uses specialized AI agents for each stage of the book creation process — from generating detailed character profiles and chapter-by-chapter outlines, to writing manuscript drafts, designing book covers, producing video commercials, and creating book marketing websites."
          }
        },
        {
          "@type": "Question",
          "name": "Is AuthorForge free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AuthorForge offers a free 7-day trial with no credit card required. After the trial, plans start at an affordable monthly rate. You can cancel anytime."
          }
        },
        {
          "@type": "Question",
          "name": "Can AuthorForge help with self-publishing on Amazon?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. AuthorForge integrates with Amazon KDP for e-book publishing and Amazon ACX for audiobook distribution, allowing authors to submit their work directly from the platform."
          }
        },
        {
          "@type": "Question",
          "name": "Does AuthorForge support team collaboration?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. AuthorForge supports role-based team collaboration, allowing authors to invite co-authors, editors, publishers, and marketing professionals with specific permissions for each book project."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
