    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Write Vibe",
      "url": "https://writevibe.ai",
      "logo": "https://writevibe.ai/logo.svg",
      "description": "Write Vibe is an AI-powered book creation suite that helps authors write, publish, and market their books using intelligent AI agents.",
      "sameAs": []
    }

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Write Vibe",
      "url": "https://writevibe.ai/",
      "publisher": { "@type": "Organization", "name": "Write Vibe" }
    }
    </script>

    <!-- Structured Data: HowTo (AEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HowTo",
      "name": "How to write and publish a book with Write Vibe",
      "description": "Write Vibe turns a book idea into a published book in five stages using specialized AI agents.",
      "step": [
        { "@type": "HowToStep", "name": "Create your book concept", "text": "Enter your book title, genre, and target audience. Write Vibe's AI builds the foundational concept for your story." },
        { "@type": "HowToStep", "name": "Generate characters and outline", "text": "AI agents create rich characters with backstories and a chapter-by-chapter outline tailored to your genre." },
        { "@type": "HowToStep", "name": "Write the manuscript", "text": "Write Vibe's writing agents draft your manuscript chapter by chapter, keeping characters and plot consistent." },
        { "@type": "HowToStep", "name": "Design your cover and trailer", "text": "Generate a professional book cover and a video commercial that match your characters and story." },
        { "@type": "HowToStep", "name": "Publish to bookstores", "text": "Submit your finished book to Amazon KDP and other bookstores directly from the platform." }
      ]
    }
    </script>

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Write Vibe",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Start with a free 7-day trial. No credit card required."
      },
      "description": "AI-powered book creation suite for authors. Features include AI character creation, smart outlining, cover design, video commercials, book websites, and team collaboration.",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "ratingCount": "50000"
      }
    }
    </script>

    <!-- Structured Data: FAQPage (AEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Write Vibe?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Write Vibe is an AI-powered book creation suite that helps authors write, publish, and market their books. It includes AI agents for character creation, smart outlining, cover design, video trailer generation, book landing pages, and team collaboration."
          }
        },
        {
          "@type": "Question",
          "name": "How does Write Vibe use AI to help write a book?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Write Vibe uses specialized AI agents for each stage of the book creation process — from generating detailed character profiles and chapter-by-chapter outlines, to writing manuscript drafts, designing book covers, producing video commercials, and creating book marketing websites."
          }
        },
        {
          "@type": "Question",
          "name": "Is Write Vibe free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Write Vibe offers a free 7-day trial with no credit card required. After the trial, plans start at an affordable monthly rate. You can cancel anytime."
          }
        },
        {
          "@type": "Question",
          "name": "Can Write Vibe help with self-publishing on Amazon?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Write Vibe integrates with Amazon KDP for e-book publishing and Amazon ACX for audiobook distribution, allowing authors to submit their work directly from the platform."
          }
        },
        {
          "@type": "Question",
          "name": "Does Write Vibe support team collaboration?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Write Vibe supports role-based team collaboration, allowing authors to invite co-authors, editors, publishers, and marketing professionals with specific permissions for each book project."
          }
        }
      ]
    }
    </script>
