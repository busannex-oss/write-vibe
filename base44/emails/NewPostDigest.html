<mjml>
  <mj-head>
    <mj-title>New on the Write Vibe Journal: {{post_title}}</mj-title>
    <mj-preview>{{post_excerpt}}</mj-preview>
    <mj-attributes>
      <mj-all font-family="Arial, Helvetica, sans-serif" />
      <mj-section background-color="#ffffff" padding="0 36px" />
      <mj-text color="#0a0a0a" font-size="15px" line-height="1.6" padding="0" />
      <mj-button background-color="#f59e0b" color="#000000" border-radius="8px" font-weight="700" inner-padding="14px 28px" align="left" />
    </mj-attributes>
  </mj-head>
  <mj-body background-color="#ffffff">
    <mj-section background-color="#f59e0b" padding="20px 36px">
      <mj-group>
        <mj-column width="15%" vertical-align="middle">
          <mj-image src="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6975e45ac14c500ed1fcdcf2/d8dcd95ca_logo.png" width="40px" padding="0" align="left" />
        </mj-column>
        <mj-column width="85%" vertical-align="middle">
          <mj-text font-size="18px" font-weight="700" color="#000000">Write Vibe</mj-text>
        </mj-column>
      </mj-group>
    </mj-section>
    <mj-section padding="36px 36px 8px">
      <mj-column>
        <mj-text font-size="13px" color="#737373" padding="0 0 8px">Hi {{first_name}}, a new post just went live</mj-text>
        <mj-text font-size="28px" font-weight="700" line-height="1.2">{{post_title}}</mj-text>
        <mj-text color="#737373" padding="10px 0 0">By {{author_name}}</mj-text>
      </mj-column>
    </mj-section>
    <mj-section padding="20px 36px 0">
      <mj-column>
        <mj-image src="{{cover_image_url}}" border-radius="8px" padding="0" />
      </mj-column>
    </mj-section>
    <mj-section padding="24px 36px 36px">
      <mj-column>
        <mj-text>{{post_excerpt}}</mj-text>
        <mj-button href="{{post_url}}" padding="24px 0 0">Read the full post</mj-button>
      </mj-column>
    </mj-section>
    <mj-section background-color="#f5f5f5" padding="20px 36px">
      <mj-column>
        <mj-text font-size="12px" color="#737373">You're receiving this because you subscribed to Write Vibe updates. Visit <a href="https://thewritevibe.net/Blog" style="color:#0a0a0a;">thewritevibe.net</a> for more.</mj-text>
      </mj-column>
    </mj-section>
  </mj-body>
</mjml>
