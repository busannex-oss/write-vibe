<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write Vibe – You're Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0f1a 0%, #0f172a 50%, #0a0f1a 100%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 2rem;
      font-size: 2.5rem;
    }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: #94a3b8; font-size: 1.1rem; max-width: 400px; line-height: 1.6; margin-bottom: 2rem; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: white;
      padding: 0.875rem 2rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .tip { margin-top: 2rem; color: #64748b; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="icon">✍️</div>
  <h1>You're Offline</h1>
  <p>Write Vibe needs an internet connection to work its AI magic. Check your connection and try again.</p>
  <button class="btn" onclick="window.location.reload()">Try Again</button>
  <p class="tip">Your work is saved automatically when you're back online.</p>
</body>
</html>
